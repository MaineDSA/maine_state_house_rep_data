default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit
        args: [--confidence-level medium, --severity-level medium, --exclude tests]
        language: system
        pass_filenames: true
        types: [python]
        exclude: tests/

      - id: ssort
        name: ssort
        entry: uv run ssort
        args: [--check]
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff
        args: [check, --fix]
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff
        args: [format]
        language: system
        pass_filenames: true
        types: [python]

      - id: ty-check
        name: ty check
        entry: uv run ty
        args: [check]
        language: system
        pass_filenames: true
        types: [python]
